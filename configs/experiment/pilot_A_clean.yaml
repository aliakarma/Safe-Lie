# STAGE 2 -- the compact pilot of PROJECT_REPORT.md §R2/§R8, condition A
# (clean baseline). This is now RUNNABLE: safelie.envs.mamujoco implements
# the Safe MAMuJoCo adapter. Install a backend first --
# `pip install "safelie[mujoco]"` (portable) or `pip install
# safety-gymnasium==1.0.0` (the reference implementation, Linux/Colab only).
#
# Read safelie/envs/mamujoco.py's docstring before interpreting any number
# from this config. Three deviations are forced by the reference
# implementation and change what the pilot may claim: ManyAgent Ant is not
# a Safe MAMuJoCo environment at all (its threshold table has no entry and
# its constructor asserts on the name), Safe MAMuJoCo's cost is shared
# across agents rather than per-agent, and its thresholds do not bind at
# this pilot's scale.
run_id: pilot_A_clean
seed: 0  # [DECISION] one of [0, 1, 2] per §R2.3; run all three for the pilot

env:
  name: manyagent_ant  # [SPEC] main_iclr.tex §5.1
  n_agents: 6           # [SPEC] N=6
  budget: 25.0          # [SPEC] d=25 per agent
  # `[DECISION]` obs_dim/action_dim are deliberately absent: the MuJoCo
  # factorization determines them (63 and 4 here) and the learner sizes its
  # networks from the constructed environment, not from this file.
  #
  # `[DECISION]` velocity_threshold=0.75, NOT Safe MAMuJoCo's nearest table
  # entry (Ant 4x2 = 2.418). §5.1 specifies no ManyAgent Ant threshold --
  # the reference implementation has no such environment -- so the
  # threshold, not the paper's [SPEC] d=25 or eta_lambda=0.035, is the free
  # parameter here. At 2.418 a fresh policy incurs cost on 0.75% of steps
  # (J_C ~ 0.75 vs d=25): lambda never leaves zero and all five conditions
  # coincide for reasons unrelated to the hypothesis -- the §R6.1
  # precondition failure.
  #
  # 0.75 rather than 1.0 because a completed 250-round condition-A run at
  # 1.0 showed the initial-calibration bar is necessary but NOT sufficient:
  # the true cost bound from round 0, yet the learner's own estimate (what
  # the dual update actually compares against d) did not cross 25 until
  # round ~159 of 250. lambda was positive in only 14% of (round, agent)
  # cells, peaked at 1.67 of lambda_max=25, and was still rising at cutoff
  # -- leaving ~86% of the run structurally unable to distinguish condition
  # A from B/C/D. The cost critic needs ~150 rounds to converge, which is
  # 60% of a 5e5-step pilot but 3% of the paper's 1e7-step scale.
  #
  # Measured (`python scripts/calibrate_cost.py --config <this file>`):
  #   thr 2.418 -> true 0.04x budget, estimate 0.02x  NON-BINDING
  #   thr 1.00  -> true 0.80x budget, estimate 0.23x  binding too late
  #   thr 0.75  -> true 1.66x budget, estimate 0.42x  BINDING
  #   thr 0.60  -> true 2.35x budget, estimate 0.49x  binding, nearer saturation
  velocity_threshold: 0.75
  cost_mode: per_agent_velocity  # `[DECISION]` resolves [GAP] G4; see mamujoco.py

topology:
  name: ring            # [DECISION] §R2.1 -- slowest-mixing connected topology,
                        # the least favourable case for the spreading claim
  n_agents: 6

sources:
  # [SPEC] M=7 = own critic + 4 peer critics + 2 replicated monitors
  sources:
    - source_id: own_critic
      source_type: own_critic
      independence_class: ic_own
    - source_id: peer_critic_1
      source_type: peer_critic
      independence_class: ic_peer1
    - source_id: peer_critic_2
      source_type: peer_critic
      independence_class: ic_peer2
    - source_id: peer_critic_3
      source_type: peer_critic
      independence_class: ic_peer3
    - source_id: peer_critic_4
      source_type: peer_critic
      independence_class: ic_peer4
    - source_id: monitor_1
      source_type: monitor
      independence_class: ic_mon1
    - source_id: monitor_2
      source_type: monitor
      independence_class: ic_mon2

attack:
  name: none  # condition A: no attack

defense:
  name: mean  # condition A uses the undefended aggregator as reference
  f: 0

ppo:
  # [SPEC] main_iclr.tex App. B hyperparameters
  clip: 0.2
  gae_lambda: 0.95
  gamma: 0.99
  lr: 0.0003
  # [GAP] G10-G12, pinned per decision D14 -- not specified by the paper
  epochs: 4
  minibatches: 4
  hidden_dim: 64

dual:
  eta_lambda: 0.035   # [SPEC]
  lambda_max: 25.0    # [SPEC]

total_steps: 500000    # [DECISION] §R2.4 -- pilot scale, 1/20 of the paper's 1e7
rollout_length: 2000   # [INFERRED] G10 -- not specified by the paper
output_dir: results/runs
