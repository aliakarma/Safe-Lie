# G10 seed 2 (docs/g10_gates.md) -- the clean three-seed validation of the
# integrated parallel trajectory-batch source architecture.
#
# This file is configs/experiment/g9_batch_clean.yaml with exactly four
# fields changed:
#
#   run_id                          g9_batch_clean -> seed2
#   seed                            0 -> 2
#   output_dir                      .../runs_constraint_batch_g9 -> .../runs_constraint_batch_g10
#   source_collection.seed_entropy  the G9 constant -> the seed-2 derivation
#
# NOTHING ELSE DIFFERS. M=3, R_m=30, d=25, eta_lambda=0.035, lambda_max=25,
# the ring topology, every PPO hyperparameter, the 2000-step rollout, the
# 250-round horizon, the validation_rounds and R_ref=120 are all inherited
# verbatim. The source architecture is the committed G9 implementation at
# git 73b1ae09473b3964a07c0d4347e425ff2896c5b2, unmodified.
#
# WHY seed_entropy IS SET HERE. SourceCollectionConfig.seed_entropy
# (src/safelie/utils/config.py:72) is a fixed constant that does NOT depend
# on cfg.seed, and the M replica streams plus the reference stream are
# spawned from it alone (src/safelie/training/source_batch.py:331). Running
# this config with only `seed: 2` changed would train a different policy
# while drawing the IDENTICAL 23,100 source seeds as seed 0 -- making the
# source sampling noise common-mode across all three seeds, so that "the
# aggregate is calibrated in every seed" would be one observation repeated
# three times. docs/g10_gates.md section 2 fixes the derivation
#
#     seed k : int(sha256(b"safelie/g10/source-entropy/seed=<k>")[:16])
#
# and scripts/g10_derive_source_entropy.py verified OFFLINE, before launch,
# that this seed's 23,100 env seeds share ZERO values with seed 0's
# recorded draws (chance expectation 0.25) -- and that the same replay
# reproduces G9 seed 0's 22,500 recorded replica seeds exactly.
#
# Cost, stated here rather than discovered at runtime: 45,000,000 source
# environment steps and ~10.1 h wall clock on the 12-CPU run machine.
# See docs/g10_gates.md section 10.

run_id: seed2
seed: 2

env:
  name: manyagent_ant   # [SPEC] main_iclr.tex 5.1
  n_agents: 6           # [SPEC] N=6
  budget: 25.0          # [SPEC] d=25 per agent -- UNCHANGED, not tuned by G9
  velocity_threshold: 0.75   # identical to pilot_A_clean.yaml
  cost_mode: per_agent_velocity

topology:
  name: ring            # identical to pilot_A_clean.yaml
  n_agents: 6

sources:
  # G8's M=3. One independence class per replica: each is a separate
  # environment instance driven by a separately spawned RNG stream in a
  # separate OS process, which is a genuinely distinct failure domain in
  # the sense docs/architecture.md's D10 accounting requires -- unlike the
  # three same-process ensemble replicas of `default_m5_sources`, which
  # deliberately share one class.
  sources:
    - source_id: batch_1
      source_type: trajectory_batch
      independence_class: ic_batch1
    - source_id: batch_2
      source_type: trajectory_batch
      independence_class: ic_batch2
    - source_id: batch_3
      source_type: trajectory_batch
      independence_class: ic_batch3

source_collection:
  mode: parallel_trajectory_batch
  M: 3          # G8's operating point -- not tuned by G9
  R_m: 30       # G8's operating point -- not tuned by G9
  # docs/g10_gates.md section 2: distinct source RNG streams for this
  # training seed. int(sha256(b'safelie/g10/source-entropy/seed=2')[:16]).
  # Verified offline pre-launch: 0 env seeds shared with seed 0.
  seed_entropy: 335268198726974212397240672597355197200
  # Compute knobs only. Every trajectory's seeds are drawn in the main
  # process, so neither can change a reported number: asserted by
  # tests/unit/test_source_batch.py, and confirmed live -- collecting the
  # same round at (9,3), (11,3) and (12,4) returned identical seeds AND
  # identical source values. Chosen by measurement on the run machine
  # (12 logical CPUs), two rounds each in a fresh process:
  #   workers= 9, chunks_per_worker=1 -> 112-122 s per 90 trajectories
  #   workers= 9, chunks_per_worker=3 -> 121.9 s
  #   workers=12, chunks_per_worker=4 -> 101.4 s   <- selected
  workers: 12
  chunks_per_worker: 4
  # docs/g9_gates.md step 3b: an independent R_ref=120 reference collected
  # under the SAME pinned theta_k at these rounds. Written to
  # validation_reference.jsonl, never to rounds.jsonl, and never fed to the
  # dual update -- it exists to separate source-implementation failure from
  # downstream policy-control failure.
  validation_rounds: [25, 75, 125, 175, 225]
  R_ref: 120

attack:
  name: none    # G9 is clean. The attack hook still runs and is the
                # identity map, so the plumbing is exercised, not bypassed.

defense:
  name: mean
  f: 0

ppo:
  # [SPEC] main_iclr.tex App. B -- identical to pilot_A_clean.yaml
  clip: 0.2
  gae_lambda: 0.95
  gamma: 0.99
  lr: 0.0003
  epochs: 4
  minibatches: 4
  hidden_dim: 64

dual:
  eta_lambda: 0.035   # [SPEC] -- UNCHANGED
  lambda_max: 25.0    # [SPEC] -- UNCHANGED

total_steps: 500000    # 250 rounds at rollout_length 2000 -- UNCHANGED
rollout_length: 2000
output_dir: results/runs_constraint_batch_g10
