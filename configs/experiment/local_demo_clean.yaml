# Same scale and sources as local_demo_attack.yaml, but with no attack --
# the local reference baseline (analogous in spirit to compact-pilot
# condition A, PROJECT_REPORT.md §R2.2, on the synthetic environment).
#
# `[DECISION]` budget=5.0, NOT the paper's d=25: the paper's budget is
# calibrated to Safe MAMuJoCo's cost scale, which this synthetic
# environment does not reproduce (see safelie/envs/synthetic.py's
# docstring). At d=25 the aggregate cost estimate never approaches the
# budget within a laptop-feasible number of rounds, lambda never lifts
# off zero, and the R6.1 "constraint not binding" precondition failure
# makes every condition (attack/RCE/benign) look identical for reasons
# unrelated to the hypothesis -- this is not a demo bug, it is exactly
# the confound PROJECT_REPORT.md §R6.1 warns about. d=5 was chosen by
# direct measurement (see docs/assumptions.md) so the constraint begins
# to bind by round ~30 of this config's ~75 rounds.
run_id: local_demo_clean
seed: 0

env:
  name: synthetic_constrained_marl
  n_agents: 6
  budget: 5.0
  horizon: 64
  obs_dim: 8
  action_dim: 2

topology:
  name: ring
  n_agents: 6

sources:
  sources:
    - source_id: own_critic
      source_type: own_critic
      independence_class: ic_own
    - source_id: peer_critic_1
      source_type: peer_critic
      independence_class: ic_peer1
    - source_id: peer_critic_2
      source_type: peer_critic
      independence_class: ic_peer2
    - source_id: peer_critic_3
      source_type: peer_critic
      independence_class: ic_peer3
    - source_id: peer_critic_4
      source_type: peer_critic
      independence_class: ic_peer4
    - source_id: monitor_1
      source_type: monitor
      independence_class: ic_mon1
    - source_id: monitor_2
      source_type: monitor
      independence_class: ic_mon2

attack:
  name: none

defense:
  name: mean
  f: 0

ppo:
  epochs: 2
  minibatches: 4
  hidden_dim: 32

dual:
  eta_lambda: 0.035
  lambda_max: 25.0

total_steps: 4800   # ~75 rounds -- see the budget note above
rollout_length: 64
output_dir: results/runs
