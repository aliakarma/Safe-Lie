# Stage 1b local smoke config (PROJECT_REPORT.md §R4).
# Synthetic CPU environment, tiny scale, no attack. Used by
# scripts/smoke_test.py and tests/smoke/. Runs in seconds on a laptop.
run_id: smoke_clean
seed: 0

env:
  name: synthetic_constrained_marl
  n_agents: 3
  budget: 25.0
  horizon: 16
  obs_dim: 6
  action_dim: 2

topology:
  name: ring
  n_agents: 3

sources:
  sources:
    - source_id: own_critic
      source_type: own_critic
      independence_class: ic_own
    - source_id: peer_critic_1
      source_type: peer_critic
      independence_class: ic_peer1
    - source_id: monitor_1
      source_type: monitor
      independence_class: ic_mon1

attack:
  name: none

defense:
  name: mean

ppo:
  epochs: 1
  minibatches: 2
  hidden_dim: 16

dual:
  eta_lambda: 0.035
  lambda_max: 25.0

total_steps: 64
rollout_length: 16
output_dir: results/runs
