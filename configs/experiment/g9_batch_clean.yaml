# G9 (docs/g9_gates.md) -- the clean pilot with the NEURAL source layer
# replaced by G8's parallel trajectory-batch architecture, and nothing else
# changed.
#
# Every field below except `sources`, `source_collection`, `run_id` and
# `output_dir` is copied verbatim from configs/experiment/pilot_A_clean.yaml,
# the config that produced results/runs_constraint_mc_g2/pilot_A_clean_seed0.
# That is deliberate and load-bearing: G9's question is whether the SOURCE
# ARCHITECTURE survives integration, so the source architecture must be the
# only difference between this run and the G2 baseline it is compared
# against. In particular d=25.0, eta_lambda=0.035, lambda_max=25.0,
# velocity_threshold=0.75, the ring topology, all PPO hyperparameters, the
# 2000-step rollout and the 250-round horizon are unchanged, and no value
# here was chosen by looking at a G9 number.
#
# What changed, and why:
#
#   sources: M=7 neural sources (own critic + 4 peer critics + 2 monitors)
#            -> M=3 trajectory-batch replicas. M=3 is G8's operating point,
#            inherited unchanged; it is also the paper's M >= 2f+1 at f=1.
#            The drop from 7 to 3 is NOT a robustness reduction chosen for
#            convenience -- G3-G7 established that 6 of the 7 neural sources
#            were not estimators of J_C^i(theta) at all, so the honest count
#            of scientifically valid sources under the old architecture was
#            never 7.
#
#   source_collection: the new block. Per dual update the policy is pinned
#            and 3 replicas each collect R_m=30 independent 2000-step
#            trajectories, reporting one Monte-Carlo scalar each. G8's
#            Step-8 derivation is why this must be parallel rather than
#            sequential: a sequential R_m=30 batch spans 30 training rounds
#            and drifts 5-8 standard errors off target.
#
# Cost, stated here rather than discovered at runtime: 180,000 source
# environment steps per dual update, 90x the PPO rollout, 46x the total
# environment interaction of the G2 configuration. See docs/g9_gates.md
# "Computational cost".

run_id: g9_batch_clean
seed: 0

env:
  name: manyagent_ant   # [SPEC] main_iclr.tex 5.1
  n_agents: 6           # [SPEC] N=6
  budget: 25.0          # [SPEC] d=25 per agent -- UNCHANGED, not tuned by G9
  velocity_threshold: 0.75   # identical to pilot_A_clean.yaml
  cost_mode: per_agent_velocity

topology:
  name: ring            # identical to pilot_A_clean.yaml
  n_agents: 6

sources:
  # G8's M=3. One independence class per replica: each is a separate
  # environment instance driven by a separately spawned RNG stream in a
  # separate OS process, which is a genuinely distinct failure domain in
  # the sense docs/architecture.md's D10 accounting requires -- unlike the
  # three same-process ensemble replicas of `default_m5_sources`, which
  # deliberately share one class.
  sources:
    - source_id: batch_1
      source_type: trajectory_batch
      independence_class: ic_batch1
    - source_id: batch_2
      source_type: trajectory_batch
      independence_class: ic_batch2
    - source_id: batch_3
      source_type: trajectory_batch
      independence_class: ic_batch3

source_collection:
  mode: parallel_trajectory_batch
  M: 3          # G8's operating point -- not tuned by G9
  R_m: 30       # G8's operating point -- not tuned by G9
  # Compute knobs only. Every trajectory's seeds are drawn in the main
  # process, so neither can change a reported number: asserted by
  # tests/unit/test_source_batch.py, and confirmed live -- collecting the
  # same round at (9,3), (11,3) and (12,4) returned identical seeds AND
  # identical source values. Chosen by measurement on the run machine
  # (12 logical CPUs), two rounds each in a fresh process:
  #   workers= 9, chunks_per_worker=1 -> 112-122 s per 90 trajectories
  #   workers= 9, chunks_per_worker=3 -> 121.9 s
  #   workers=12, chunks_per_worker=4 -> 101.4 s   <- selected
  workers: 12
  chunks_per_worker: 4
  # docs/g9_gates.md step 3b: an independent R_ref=120 reference collected
  # under the SAME pinned theta_k at these rounds. Written to
  # validation_reference.jsonl, never to rounds.jsonl, and never fed to the
  # dual update -- it exists to separate source-implementation failure from
  # downstream policy-control failure.
  validation_rounds: [25, 75, 125, 175, 225]
  R_ref: 120

attack:
  name: none    # G9 is clean. The attack hook still runs and is the
                # identity map, so the plumbing is exercised, not bypassed.

defense:
  name: mean
  f: 0

ppo:
  # [SPEC] main_iclr.tex App. B -- identical to pilot_A_clean.yaml
  clip: 0.2
  gae_lambda: 0.95
  gamma: 0.99
  lr: 0.0003
  epochs: 4
  minibatches: 4
  hidden_dim: 64

dual:
  eta_lambda: 0.035   # [SPEC] -- UNCHANGED
  lambda_max: 25.0    # [SPEC] -- UNCHANGED

total_steps: 500000    # 250 rounds at rollout_length 2000 -- UNCHANGED
rollout_length: 2000
output_dir: results/runs_constraint_batch_g9
