# Local CPU demonstration of the attack mechanism on the SYNTHETIC
# environment (safelie.envs.synthetic). This is NOT Safe MAMuJoCo and its
# numbers are NOT comparable to main_iclr.tex Table 3 in any way -- it
# exists only to show the attack -> dual bias -> policy pathway actually
# moves through this codebase, at a scale a laptop can run in seconds.
#
# f=1 source corrupted, persistent static under-reporting at B/d=0.5,
# undefended (mean) aggregation -- the "attacked, unprotected" condition,
# analogous in spirit to PROJECT_REPORT.md's compact-pilot condition B
# (§R2.2), but on a toy environment, at toy scale, with 1 seed.
#
# `[DECISION]` budget=5.0, NOT the paper's d=25 -- see local_demo_clean.yaml's
# comment for why: this repository's synthetic environment does not share
# Safe MAMuJoCo's cost scale, and at d=25 the constraint never binds
# within a laptop-feasible run (the R6.1 confound).
run_id: local_demo_attack
seed: 0

env:
  name: synthetic_constrained_marl
  n_agents: 6
  budget: 5.0
  horizon: 64
  obs_dim: 8
  action_dim: 2

topology:
  name: ring
  n_agents: 6

sources:
  sources:
    - source_id: own_critic
      source_type: own_critic
      independence_class: ic_own
    - source_id: peer_critic_1
      source_type: peer_critic
      independence_class: ic_peer1
    - source_id: peer_critic_2
      source_type: peer_critic
      independence_class: ic_peer2
    - source_id: peer_critic_3
      source_type: peer_critic
      independence_class: ic_peer3
    - source_id: peer_critic_4
      source_type: peer_critic
      independence_class: ic_peer4
    - source_id: monitor_1
      source_type: monitor
      independence_class: ic_mon1
    - source_id: monitor_2
      source_type: monitor
      independence_class: ic_mon2

attack:
  name: primary
  f: 1
  budget_ratio: 0.5
  direction: negative
  support: persistent
  adaptivity: static
  consistency: consistent

defense:
  name: mean
  f: 1

ppo:
  epochs: 2
  minibatches: 4
  hidden_dim: 32

dual:
  eta_lambda: 0.035
  lambda_max: 25.0

total_steps: 4800   # ~75 rounds -- see the budget note above
rollout_length: 64
output_dir: results/runs
