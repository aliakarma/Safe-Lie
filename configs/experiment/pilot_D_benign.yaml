# STAGE 2 -- Google Colab T4 GPU pilot. See pilot_A_clean.yaml's header:
# NOT executable locally. Condition D: the falsification control
# (PROJECT_REPORT.md §R2.2, §R6.4) -- "the paper commits in advance to
# withdrawing its central claim if this separation is not reproduced."
# Read BEFORE condition C per §R8.3: if the benign gap does not separate
# from the attacked gap, the defense comparison is moot.
run_id: pilot_D_benign
seed: 0  # run all of [0, 1, 2] per §R2.3

env:
  name: manyagent_ant
  n_agents: 6
  budget: 25.0

topology:
  name: ring
  n_agents: 6

sources:
  sources:
    - source_id: own_critic
      source_type: own_critic
      independence_class: ic_own
    - source_id: peer_critic_1
      source_type: peer_critic
      independence_class: ic_peer1
    - source_id: peer_critic_2
      source_type: peer_critic
      independence_class: ic_peer2
    - source_id: peer_critic_3
      source_type: peer_critic
      independence_class: ic_peer3
    - source_id: peer_critic_4
      source_type: peer_critic
      independence_class: ic_peer4
    - source_id: monitor_1
      source_type: monitor
      independence_class: ic_mon1
    - source_id: monitor_2
      source_type: monitor
      independence_class: ic_mon2

attack:
  # unbiased zero-mean noise, magnitude matched to the attack's budget --
  # NOT an attacker, the falsification control [SPEC]
  name: benign_control
  f: 1
  budget_ratio: 0.5

defense:
  name: mean
  f: 1

ppo:
  clip: 0.2
  gae_lambda: 0.95
  gamma: 0.99
  lr: 0.0003
  epochs: 4
  minibatches: 4
  hidden_dim: 64

dual:
  eta_lambda: 0.035
  lambda_max: 25.0

total_steps: 500000
rollout_length: 2000
output_dir: results/runs
