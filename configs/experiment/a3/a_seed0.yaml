# A3 condition A' -- CLEAN / NO RCE (docs/a3_gates.md). Training seed 0.
#
# The clean reference at m=5.
#
# This is the FROZEN A1/G10/A2 architecture with EXACTLY ONE scientific
# change: M goes 3 -> 5. Everything else is inherited verbatim --
# manyagent_ant N=6, ring topology, d=25, velocity_threshold=0.75,
# cost_mode=per_agent_velocity, R_m=30, pinned-policy parallel
# trajectory-batch collection, constraint_estimator=mc_window, every PPO
# hyperparameter, eta_lambda=0.035, lambda_max=25, 250 rounds at
# rollout_length 2000, and the R_ref=120 withheld reference at rounds
# {25,75,125,175,225}.
#
# MACHINE: A3 runs ENTIRELY on one GCP t2d-standard-60 instance (AMD Milan,
# x86-64), per gates doc section 15. The original BRANCH-B' assignment was
# the Mac mini (section 12.4); the platform moved and the reason is recorded
# as an amendment rather than by editing the pre-declaration. The RULE is
# unchanged and is what actually matters: the cross-platform probe showed
# torch initialises different weights on a different architecture, so every
# contrast must live on ONE machine. All twelve runs use one instance, one
# machine type and one CPU platform, so there is no machine factor at all.
#
# `workers: 30` (was 12 on the laptop/Mac). This is a COMPUTE-ONLY change.
# Worker count is scientifically invariant because trajectory seeds are
# generated in the parent process and each worker is a pure function of the
# same (policy, env_seed, torch_seed) tuple -- measured bitwise identical at
# M=5 across workers in {1,2,4,5,6,8,12}, both dispatch paths, at R_m=8 and
# at production R_m=30 (tests/unit/test_a3_verify_frozen_workers.py,
# tests/unit/test_source_batch.py). 30 divides the 150-trajectory round
# exactly (5 waves, no straggler), and two seeds run concurrently at 30
# workers each on the 60-vCPU instance.
#
# COMMON RANDOM NUMBERS: all four conditions of seed 0 share `seed: 0` and
# this `seed_entropy`, so at round 0 the pre-attack source draws are
# bit-identical across A'/B'/C'/E' and the only difference is the mechanism.
# The entropy is NEW, not A2's: A3 spawns M+1 = 6 streams where A2 spawned
# 4, and reusing A2's would start A3's first three replicas at the same
# points, correlating two campaigns that must be independent.
run_id: A_seed0
seed: 0

env:
  name: manyagent_ant   # [SPEC] main_iclr.tex 5.1
  n_agents: 6           # [SPEC] N=6
  budget: 25.0          # [SPEC] d=25 per agent
  velocity_threshold: 0.75
  cost_mode: per_agent_velocity

topology:
  name: ring
  n_agents: 6

sources:
  # M=5. One independence class per replica: each is a separate environment
  # instance driven by a separately spawned RNG stream in a separate OS
  # process. THE ONLY SCIENTIFIC CHANGE FROM A2 -- two more sources, which
  # is what lifts |T| from 1 to 3 and makes the MAD real.
  sources:
    - source_id: batch_1
      source_type: trajectory_batch
      independence_class: ic_batch1
    - source_id: batch_2
      source_type: trajectory_batch
      independence_class: ic_batch2
    - source_id: batch_3
      source_type: trajectory_batch
      independence_class: ic_batch3
    - source_id: batch_4
      source_type: trajectory_batch
      independence_class: ic_batch4
    - source_id: batch_5
      source_type: trajectory_batch
      independence_class: ic_batch5

source_collection:
  mode: parallel_trajectory_batch
  M: 5          # A2 used 3
  R_m: 30       # UNCHANGED from G8/G9/G10/A1/A2
  # docs/a3_gates.md section 5:
  # int(sha256(b'safelie/a3/source-entropy/seed=0').digest()[:16])
  seed_entropy: 25873748826208450093657097358164192435
  workers: 30
  chunks_per_worker: 4
  validation_rounds: [25, 75, 125, 175, 225]
  R_ref: 120

attack:
  name: none    # Conditions A' and E' are clean. The attack hook still runs
                # and is the identity map, so the plumbing is exercised.

defense:
  # A3 conditions A' and B' are UNDEFENDED, exactly as A1/A2's A and B were:
  # plain mean aggregation with f=0. They are the references the defense is
  # measured against, not a defense.
  name: mean
  f: 0

ppo:
  # [SPEC] main_iclr.tex App. B -- identical to A1/A2
  clip: 0.2
  gae_lambda: 0.95
  gamma: 0.99
  lr: 0.0003
  epochs: 4
  minibatches: 4
  hidden_dim: 64

dual:
  eta_lambda: 0.035   # [SPEC] -- UNCHANGED
  lambda_max: 25.0    # [SPEC] -- UNCHANGED

total_steps: 500000    # 250 rounds at rollout_length 2000 -- UNCHANGED
rollout_length: 2000
output_dir: results/runs_a3
