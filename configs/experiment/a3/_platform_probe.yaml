# A3 cross-platform probe (docs/a3_gates.md section 9).
#
# configs/experiment/a2/_mechanism_check_rce_clean.yaml with ONLY run_id and
# output_dir changed, so the run this produces on a SECOND machine is
# comparable, field for field, with the copy this repository already carries
# at results/a2_mechanism_check/mech_rce_clean -- which was produced on the
# first machine and is committed.
#
# run_id and output_dir cannot affect a number: seeding derives from cfg.seed
# and source_collection.seed_entropy alone, and both are unchanged here. They
# are changed ONLY so the second machine does not overwrite the reference it
# is being compared against.
#
# Its job is to decide, by measurement, whether A3 may split its 12 runs by
# CONDITION (6/6, 3 seeds) or must split them by whole SEED (4/4, 2 seeds).
# Both branches are pre-declared in docs/a3_gates.md before any A3 run exists.
#
# 4 rounds + 1 calibration round, about 15 minutes. Discarded after the
# comparison; NOT an A3 result.
run_id: probe
seed: 0

env:
  name: manyagent_ant
  n_agents: 6
  budget: 25.0
  velocity_threshold: 0.75
  cost_mode: per_agent_velocity

topology:
  name: ring
  n_agents: 6

sources:
  sources:
    - source_id: batch_1
      source_type: trajectory_batch
      independence_class: ic_batch1
    - source_id: batch_2
      source_type: trajectory_batch
      independence_class: ic_batch2
    - source_id: batch_3
      source_type: trajectory_batch
      independence_class: ic_batch3

source_collection:
  mode: parallel_trajectory_batch
  M: 3
  R_m: 30
  seed_entropy: 286314957402113664887331205920951063913   # seed 0, the G9 constant
  workers: 12
  chunks_per_worker: 4
  validation_rounds: [2]    # moved into range; production uses [25,75,125,175,225]
  R_ref: 120

attack:
  name: none

defense:
  # A2 mechanism check: the shipped RCE defense, EXCEPT calibration_rounds,
  # which is 1 here instead of the production 20. That knob feeds only the
  # logged Boolean `guarantee_in_force`, and at M=3/f=1 every clean spread
  # is exactly sigma_min, so `epsilon_offline` is the quantile of a constant
  # vector and equals sigma_min for ANY round count. Lowering it here cannot
  # change a number; it just stops a 4-round throwaway check from paying for
  # 20 calibration rounds. Production C/E configs keep the default 20.
  name: rce
  f: 1
  beta: 1.5
  sigma_min: 0.001
  min_retained: 3
  calibration_rounds: 1
  calibration_alpha: 0.05

ppo:
  clip: 0.2
  gae_lambda: 0.95
  gamma: 0.99
  lr: 0.0003
  epochs: 4
  minibatches: 4
  hidden_dim: 64

dual:
  eta_lambda: 0.035
  lambda_max: 25.0

total_steps: 8000     # 4 rounds
rollout_length: 2000
output_dir: results/a3_platform_probe
