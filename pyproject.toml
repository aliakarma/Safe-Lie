[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "safelie"
version = "0.1.0"
description = "Corrupted-Signal Multi-Agent RL: reference implementation, attack harness, and RCE defense for 'When the Safety Signal Lies'"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SafeLie contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "torch>=2.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "networkx>=3.2",
    "pandas>=2.1",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]
viz = [
    "matplotlib>=3.8",
]
# The portable Safe MAMuJoCo backend. Supplies the factorized physics but
# no cost signal -- safelie.envs.mamujoco supplies that, as a documented
# [DECISION]. The reference implementation (`safety-gymnasium==1.0.0`) is
# deliberately NOT listed: it pins gymnasium==0.28.1 / mujoco==2.3.3 and
# cannot coexist with these, so it must be installed into its own
# environment. See safelie/envs/mamujoco.py's docstring.
mujoco = [
    "mujoco>=3.1",
    "gymnasium-robotics>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
